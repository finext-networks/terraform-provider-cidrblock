name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

env:
  GO_VERSION: '1.25'
  CGO_ENABLED: 0

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # NEW: Robust GPG Import that handles passphrase and exports fingerprint
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.5.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the dynamic output from the import step
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GoReleaser needs the passphrase as an env var to sign the detached signatures
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
