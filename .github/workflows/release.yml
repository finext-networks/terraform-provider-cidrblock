# Release workflow uses GoReleaser to build and publish Terraform Provider binaries
# Reference: https://github.com/hashicorp/terraform-provider-release

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

env:
  GO_VERSION: '1.21'
  CGO_ENABLED: 0

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe4b10d3ae06a7f2e1e5d40faf5513 # v4.2.2
        with:
          # GoReleaser standard requires access to the full git history
          fetch-depth: 0

      - uses: actions/setup-go@f111536c599f0033146361be355c2f2f2d9740f8 # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9ed2f89a6f1bf3e77fa458c841f7b46c5cc0877f # v6.2.0
        with:
          version: v2.5.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
