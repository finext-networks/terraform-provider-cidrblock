name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'

permissions:
  contents: read

jobs:
  # Ensure the code follows formatting standards
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          go mod tidy
          diff=$(git diff --ignore-space-change --color=never go.mod)
          gofmt_diff=$(go fmt ./...)
          if [ -n "$diff" ] || [ -n "$gofmt_diff" ]; then
            echo "go.mod and/or go formatters would apply changes:"
            echo "$diff"
            echo "$gofmt_diff"
            exit 1
          fi

  # Run linter
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5

  # Validate documentation matches schema definitions without drift
  generate:
    name: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: |
          go generate ./...
          git diff --exit-code docs/ || (echo "Generated documentation is out of date with schema changes. Run 'make generate' locally and commit the resulting docs/ directory additions." && exit 1)

  # Run core unit and property-based fuzz tests
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: |
          go test -v -cover -timeout=10m -parallel=4 ./...

  # Run acceptance tests with Terraform CLI
  testacc:
    name: testacc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
      - run: |
          TF_ACC=1 go test -v -cover -timeout=15m -parallel=4 ./...

  # Run automated native HCL end-to-end integration test scenarios
  test-e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
      - name: Run E2E Automation Target
        run: make test-e2e

